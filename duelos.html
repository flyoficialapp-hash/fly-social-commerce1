<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FLY - Duelos</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background: var(--bg-color); background-image: var(--bg-gradient); min-height: 100vh; }
    .header { padding: 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: rgba(3, 7, 18, 0.95); backdrop-filter: blur(10px); z-index: 100; border-bottom: 1px solid var(--glass-border); }
    .header-title { font-size: 1.4rem; font-weight: 800; color: white; display: flex; align-items: center; gap: 10px; font-style: italic; }
    .header-title i { color: #ffd700; font-size: 1.5rem; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
    
    .top-actions { padding: 15px; display: flex; justify-content: center; }
    .btn-create-duel { width: 100%; max-width: 400px; padding: 15px; border-radius: 30px; background: linear-gradient(90deg, #7e22ce, #a855f7); color: white; font-weight: bold; font-size: 1.1rem; border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; box-shadow: 0 0 20px rgba(168, 85, 247, 0.4); transition: 0.3s; text-decoration: none; }
    .btn-create-duel:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(168, 85, 247, 0.6); }

    .tabs { display: flex; gap: 10px; padding: 0 15px 15px 15px; overflow-x: auto; scrollbar-width: none; }
    .tab { padding: 10px 20px; border-radius: 25px; background: var(--glass-bg); border: 1px solid var(--glass-border); font-size: 0.9rem; color: var(--text-muted); cursor: pointer; white-space: nowrap; font-weight: bold; transition: 0.3s; }
    .tab.active { background: var(--primary); color: white; border-color: var(--neon); box-shadow: 0 0 15px rgba(0, 204, 255, 0.4); }

    .feed { padding: 0 15px 100px 15px; display: flex; flex-direction: column; gap: 20px; }
    
    .duel-card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; padding: 15px; position: relative; overflow: hidden; }
    .duel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .creator-info { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .creator-info img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--neon); object-fit: cover; }
    .creator-info .name { font-weight: bold; color: white; font-size: 0.95rem; }
    .creator-info .time { font-size: 0.75rem; color: var(--text-muted); }
    
    .duel-question { font-size: 1.2rem; font-weight: bold; color: white; text-align: center; margin-bottom: 15px; }
    
    .duel-options { display: flex; gap: 10px; position: relative; margin-bottom: 15px; }
    .duel-option { flex: 1; border-radius: 15px; overflow: hidden; background: #111; cursor: pointer; position: relative; border: 2px solid transparent; transition: 0.2s; }
    .duel-option:hover { border-color: #a855f7; }
    .duel-option img { width: 100%; height: 120px; object-fit: cover; display: block; }
    .duel-option .opt-text { padding: 10px; text-align: center; font-weight: bold; color: white; background: rgba(0,0,0,0.6); font-size: 0.9rem; }
    .vs-badge { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: linear-gradient(45deg, #7e22ce, #ec4899); width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: 900; color: white; border: 3px solid var(--bg-color); box-shadow: 0 0 15px rgba(236, 72, 153, 0.6); z-index: 10; font-size: 1rem; font-style: italic; }

    .duel-footer { display: flex; justify-content: space-between; align-items: center; }
    .duel-stats { display: flex; gap: 15px; font-size: 0.8rem; color: var(--text-muted); }
    .duel-stats i { color: var(--neon); }
    .btn-vote { padding: 10px 25px; border-radius: 20px; background: var(--primary); color: white; font-weight: bold; border: none; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: 0.3s; }
    .btn-vote:hover { background: var(--neon); color: #000; }

    .result-bar-container { display: none; flex-direction: column; gap: 5px; margin-bottom: 15px; }
    .result-bar-row { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; font-weight: bold; color: white; }
    .result-bar-bg { flex: 1; height: 20px; background: #222; border-radius: 10px; overflow: hidden; position: relative; }
    .result-bar-fill { height: 100%; width: 0%; transition: width 1s ease-out; }
    .fill-a { background: linear-gradient(90deg, #0066ff, #00ccff); }
    .fill-b { background: linear-gradient(90deg, #7e22ce, #ec4899); }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-title"><i class="fa-solid fa-trophy"></i> Fly Duelo</div>
    <div style="display: flex; gap: 15px;">
      <i class="fa-solid fa-magnifying-glass" style="color: white; font-size: 1.2rem; cursor: pointer;"></i>
    </div>
  </header>

  <div class="top-actions">
    <a href="criar_duelo.html" class="btn-create-duel"><i class="fa-solid fa-plus"></i> Criar Duelo</a>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('todos', this)">Todos</div>
    <div class="tab" onclick="switchTab('meus', this)">Meus Duelos</div>
  </div>

  <div class="feed" id="duelosFeed">
    <!-- Skeleton Loader -->
    <div class="skeleton-post">
      <div class="skeleton-header"><div class="skeleton-avatar"></div><div class="skeleton-text"></div></div>
      <div class="skeleton-img"></div>
      <div class="skeleton-actions"><div class="skeleton-icon"></div><div class="skeleton-icon"></div></div>
    </div>
    <div class="skeleton-post">
      <div class="skeleton-header"><div class="skeleton-avatar"></div><div class="skeleton-text"></div></div>
      <div class="skeleton-img"></div>
      <div class="skeleton-actions"><div class="skeleton-icon"></div><div class="skeleton-icon"></div></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="home.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Início</span></a>
    <a href="mercado.html" class="nav-item"><i class="fa-solid fa-bag-shopping"></i><span>Mercado</span></a>
    <a href="duelos.html" class="nav-item active" style="color: #ffd700; transform: scale(1.1);"><i class="fa-solid fa-trophy"></i><span style="font-weight: bold;">Duelo</span></a>
    <a href="chat.html" class="nav-item"><i class="fa-solid fa-comment-dots"></i><span>Chat</span><span class="nav-badge" id="chat-badge" style="display:none;">0</span></a>
    <a href="gerenciar_vendas.html" class="nav-item"><i class="fa-solid fa-briefcase"></i><span>Negócios</span></a>
    <a href="perfil.html" class="nav-item"><i class="fa-solid fa-user"></i><span>Perfil</span></a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/calls.js"></script>
  <script>
    let currentUser = null;
    let currentTab = 'todos';
    let allDuels = [];

    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.className = `fly-toast ${type}`;
      toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> ${message}`;
      document.body.appendChild(toast);
      void toast.offsetWidth;
      toast.classList.add('show');
      setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3000);
    }

    async function init() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }
      currentUser = session.user.id;
      
      updateBadges();
      loadDuels();
    }

    async function updateBadges() {
      if (!currentUser) return;
      const { count: chatCount } = await supabaseClient.from('messages').select('*', { count: 'exact', head: true }).eq('receiver_id', currentUser).eq('is_read', false);
      const chatBadge = document.getElementById('chat-badge');
      if (chatBadge) { if (chatCount > 0) { chatBadge.innerText = chatCount; chatBadge.style.display = 'flex'; } else { chatBadge.style.display = 'none'; } }
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      renderDuels();
    }

    async function loadDuels() {
      const feed = document.getElementById('duelosFeed');
      
      const { data: duels, error } = await supabaseClient
        .from('duels')
        .select(`
          *,
          profiles!creator_id (username, avatar_url, is_premium),
          duel_votes (choice)
        `)
        .order('created_at', { ascending: false });

      if (error) { 
        feed.innerHTML = `<p style="color:red; text-align:center;">Erro: ${error.message}</p>`; 
        showToast('Erro ao carregar duelos.', 'error');
        return; 
      }
      
      if (!duels || duels.length === 0) {
        feed.innerHTML = `<div style="text-align:center; color:var(--text-muted); margin-top:40px;"><i class="fa-solid fa-trophy" style="font-size:3rem; opacity:0.3; margin-bottom:15px;"></i><p>Nenhum duelo criado ainda. Sê o primeiro!</p></div>`;
        return;
      }

      allDuels = duels;
      renderDuels();
    }

    function renderDuels() {
      const feed = document.getElementById('duelosFeed');
      feed.innerHTML = '';

      let filtered = allDuels;
      if (currentTab === 'meus') {
        filtered = allDuels.filter(d => d.creator_id === currentUser);
      }

      if (filtered.length === 0) {
        feed.innerHTML = `<p style="text-align:center; color:var(--text-muted); margin-top:40px;">Nenhum duelo encontrado.</p>`;
        return;
      }

      filtered.forEach(duel => {
        const creatorName = duel.profiles ? duel.profiles.username : 'Utilizador FLY';
        const creatorAvatar = duel.profiles && duel.profiles.avatar_url ? duel.profiles.avatar_url : 'default-avatar.png';
        
        const votesA = duel.duel_votes.filter(v => v.choice === 'A').length;
        const votesB = duel.duel_votes.filter(v => v.choice === 'B').length;
        const totalVotes = votesA + votesB;
        
        const now = new Date();
        const endsAt = new Date(duel.ends_at);
        const isExpired = now > endsAt;
        
        let timeString = "Terminado";
        if (!isExpired) {
          const diffMs = endsAt - now;
          const diffHrs = Math.floor(diffMs / 3600000);
          const diffMins = Math.floor((diffMs % 3600000) / 60000);
          if (diffHrs > 0) timeString = `${diffHrs}h ${diffMins}m`;
          else timeString = `${diffMins}m`;
        }

        const imgA = duel.option_a_image || 'https://via.placeholder.com/150/0000FF/FFFFFF?text=Opção+A';
        const imgB = duel.option_b_image || 'https://via.placeholder.com/150/800080/FFFFFF?text=Opção+B';

        const card = document.createElement('div');
        card.className = 'duel-card';
        card.innerHTML = `
          <div class="duel-header">
            <div class="creator-info" onclick="window.location.href='perfil.html?id=${duel.creator_id}'">
              <img src="${creatorAvatar}">
              <div>
                <div class="name">${creatorName} ${duel.profiles?.is_premium ? '👑' : ''}</div>
                <div class="time">${isExpired ? 'Encerrado' : `Termina em ${timeString}`}</div>
              </div>
            </div>
            <div style="color: #ffd700; font-size: 1.2rem;"><i class="fa-solid fa-trophy"></i></div>
          </div>
          
          <div class="duel-question">${duel.question}</div>
          
          <div class="result-bar-container" id="results-${duel.id}" style="${isExpired ? 'display:flex;' : 'display:none;'}">
             <div class="result-bar-row">
                <span>A: ${totalVotes > 0 ? Math.round((votesA/totalVotes)*100) : 0}%</span>
                <div class="result-bar-bg"><div class="result-bar-fill fill-a" style="width: ${totalVotes > 0 ? (votesA/totalVotes)*100 : 0}%"></div></div>
             </div>
             <div class="result-bar-row">
                <span>B: ${totalVotes > 0 ? Math.round((votesB/totalVotes)*100) : 0}%</span>
                <div class="result-bar-bg"><div class="result-bar-fill fill-b" style="width: ${totalVotes > 0 ? (votesB/totalVotes)*100 : 0}%"></div></div>
             </div>
          </div>

          <div class="duel-options">
            <div class="duel-option">
              <img src="${imgA}">
              <div class="opt-text">${duel.option_a_text}</div>
            </div>
            <div class="vs-badge">VS</div>
            <div class="duel-option">
              <img src="${imgB}">
              <div class="opt-text">${duel.option_b_text}</div>
            </div>
          </div>

          <div class="duel-footer">
            <div class="duel-stats">
              <div><i class="fa-solid fa-users"></i> ${totalVotes} votos</div>
              <div><i class="fa-solid fa-clock"></i> ${timeString}</div>
            </div>
            <button class="btn-vote" onclick="window.location.href='duelo.html?id=${duel.id}'">
              <i class="fa-solid fa-check"></i> ${isExpired ? 'Ver Resultado' : 'Votar'}
            </button>
          </div>
        `;
        feed.appendChild(card);
      });
    }

    init();
  </script>
</body>
</html>
