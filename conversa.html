<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>FLY - Chat</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --chat-bg: #050b14; --sent-bg: #0055ff; --received-bg: rgba(10, 25, 50, 0.6); --input-bg: rgba(10, 25, 50, 0.9); }
    html, body { height: 100vh; height: 100dvh; margin: 0; padding: 0; overflow: hidden; overscroll-behavior: none; background: var(--chat-bg); }
    body { display: flex; flex-direction: column; font-family: 'Inter', sans-serif; }
    .chat-header { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 10px 15px; background: rgba(3, 7, 18, 0.95); border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 10; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-left i { font-size: 1.5rem; cursor: pointer; color: white; }
    .chat-avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid var(--neon); }
    .chat-user-info { display: flex; flex-direction: column; }
    .chat-user-name { font-weight: bold; font-size: 1rem; color: white; display: flex; align-items: center; gap: 5px; }
    .chat-status { font-size: 0.75rem; color: var(--success); display: flex; align-items: center; gap: 4px; }
    .chat-status .dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; box-shadow: 0 0 5px var(--success); }
    .header-actions { display: flex; gap: 12px; }
    .header-actions i { font-size: 1.3rem; cursor: pointer; width: 35px; height: 35px; display: flex; justify-content: center; align-items: center; border-radius: 50%; }
    .header-actions .phone { color: #00e676; background: rgba(0, 230, 118, 0.15); }
    .header-actions .video { color: #00ccff; background: rgba(0, 204, 255, 0.15); }
    .header-actions .more { color: white; background: rgba(255, 255, 255, 0.1); }

    .chat-messages { flex: 1; min-height: 0; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
    
    .message-row { display: flex; align-items: flex-end; gap: 8px; max-width: 85%; user-select: none; -webkit-user-select: none; transition: transform 0.1s; }
    .message-row:active { transform: scale(0.98); }
    
    .message-row.sent { align-self: flex-end; flex-direction: row-reverse; }
    .message-row.received { align-self: flex-start; }
    .msg-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1px solid var(--glass-border); margin-bottom: 18px;}
    .message { padding: 12px 16px; border-radius: 18px; font-size: 0.95rem; line-height: 1.4; position: relative; word-wrap: break-word; overflow-wrap: break-word; max-width: 100%; color: white; }
    .message-row.sent .message { background: var(--sent-bg); border-bottom-right-radius: 4px; }
    .message-row.received .message { background: var(--received-bg); border: 1px solid var(--glass-border); border-bottom-left-radius: 4px; }
    
    .message-image { max-width: 100%; border-radius: 12px; margin-bottom: 5px; cursor: pointer; display: block; }
    .message-video { max-width: 100%; border-radius: 12px; margin-bottom: 5px; display: block; background: #000; }
    .message-audio { max-width: 100%; margin-bottom: 5px; display: block; }
    
    .message-footer { display: flex; justify-content: flex-end; align-items: center; gap: 5px; margin-top: 5px; }
    .message-time { font-size: 0.65rem; color: rgba(255,255,255,0.6); }
    .read-receipt { font-size: 0.75rem; color: #fff; }
    .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); text-align: center; padding: 40px 20px; }
    .empty-state i { font-size: 3rem; margin-bottom: 15px; opacity: 0.5; color: var(--neon); }
    .empty-state h3 { color: white; margin-bottom: 8px; font-size: 1.1rem; }

    .typing-indicator { display: none; align-items: center; gap: 4px; padding: 10px 15px; background: var(--received-bg); border-radius: 18px; border-bottom-left-radius: 4px; width: fit-content; margin-bottom: 15px; }
    .typing-indicator span { width: 6px; height: 6px; background: rgba(255,255,255,0.6); border-radius: 50%; display: inline-block; animation: typing 1.4s infinite ease-in-out both; }
    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; } .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

    .chat-bottom-area { flex-shrink: 0; background: rgba(3, 7, 18, 0.95); border-top: 1px solid rgba(255,255,255,0.05); padding: 10px 15px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 20; display: flex; flex-direction: column; gap: 12px; }
    .text-input-row { display: flex; gap: 10px; align-items: center; }
    .text-input-wrapper { flex: 1; display: flex; align-items: center; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 25px; padding: 5px 15px; }
    .text-input-wrapper i { color: var(--text-muted); font-size: 1.3rem; cursor: pointer; padding: 5px; }
    .chat-input { flex: 1; min-width: 0; background: transparent; border: none; padding: 10px; color: white; outline: none; font-size: 0.95rem; }

    .action-buttons-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; overflow-x: auto; scrollbar-width: none; }
    .action-buttons-row::-webkit-scrollbar { display: none; }
    .action-btn-circle { display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; min-width: 55px; }
    .action-btn-circle .icon-bg { width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: center; align-items: center; font-size: 1.3rem; color: white; transition: 0.2s; }
    .action-btn-circle:hover .icon-bg { background: rgba(255,255,255,0.1); }
    .action-btn-circle:active .icon-bg { transform: scale(0.9); background: var(--neon); color: #000; }
    .action-btn-circle span { font-size: 0.7rem; color: var(--text-muted); }
    
    .action-btn-circle.send .icon-bg { background: var(--primary); border-color: var(--neon); font-size: 1.5rem; box-shadow: 0 0 15px rgba(0, 204, 255, 0.4); }
    .action-btn-circle.send span { color: var(--primary); font-weight: bold; }

    .recording-status { position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--danger); color: white; padding: 10px 20px; border-radius: 20px; font-weight: bold; display: none; align-items: center; gap: 10px; z-index: 30; box-shadow: 0 0 20px rgba(255, 51, 102, 0.5); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

    .bottom-sheet-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 9999; display: none; justify-content: center; align-items: flex-end; backdrop-filter: blur(3px); }
    .bottom-sheet { background: #0a1f44; width: 100%; max-width: 500px; border-top-left-radius: 25px; border-top-right-radius: 25px; padding: 25px; padding-bottom: 40px; border-top: 1px solid var(--neon); animation: slideUp 0.3s ease-out; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .sheet-handle { width: 40px; height: 5px; background: rgba(255,255,255,0.2); border-radius: 5px; margin: 0 auto 20px auto; }
    .sheet-title { text-align: center; color: white; font-weight: bold; font-size: 1.1rem; margin-bottom: 20px; }
    .sheet-btn { width: 100%; padding: 15px; border-radius: 12px; border: none; font-size: 1rem; font-weight: bold; display: flex; align-items: center; gap: 15px; cursor: pointer; margin-bottom: 10px; transition: 0.2s; background: rgba(255,255,255,0.05); color: white; border: 1px solid var(--glass-border); }
    .sheet-btn i { font-size: 1.2rem; width: 24px; text-align: center; }
    .sheet-btn.danger { color: var(--danger); border-color: var(--danger); background: rgba(255, 51, 102, 0.1); }
    .sheet-btn.cancel { justify-content: center; color: var(--text-muted); background: transparent; border: none; margin-top: 10px; }

    .blocked-warning { display: none; text-align: center; padding: 20px; background: rgba(255, 51, 102, 0.1); border-top: 1px solid var(--danger); color: var(--danger); font-weight: bold; font-size: 0.9rem; }
  </style>
</head>
<body>
  <header class="chat-header">
    <div class="header-left">
      <i class="fa-solid fa-arrow-left" onclick="window.location.href='chat.html'"></i>
      <img id="chatAvatar" src="default-avatar.png" class="chat-avatar" alt="Avatar">
      <div class="chat-user-info">
        <div id="chatSellerName" class="chat-user-name">A carregar... <i class="fa-solid fa-circle-check" style="color: var(--neon); font-size: 0.8rem;"></i></div>
        <div class="chat-status"><div class="dot"></div> Online agora</div>
      </div>
    </div>
    <div class="header-actions">
      <i class="fa-solid fa-phone phone" onclick="startCall('audio')"></i>
      <i class="fa-solid fa-video video" onclick="startCall('video')"></i>
      <i class="fa-solid fa-ellipsis-vertical more" onclick="openChatOptions()"></i>
    </div>
  </header>

  <div class="chat-messages" id="chatMessages"></div>
  
  <div class="typing-indicator" id="typingIndicator">
    <span></span><span></span><span></span>
  </div>

  <div class="recording-status" id="recordingStatus">
    <i class="fa-solid fa-circle"></i> <span id="recordingText">A gravar...</span>
  </div>

  <div class="chat-bottom-area" id="chatInputArea">
    <div class="text-input-row">
      <div class="text-input-wrapper">
        <i class="fa-regular fa-face-smile" onclick="toggleEmojiPanel()"></i>
        <input type="text" id="messageInput" class="chat-input" placeholder="Escreva a sua mensagem..." onkeypress="handleKeyPress(event)" autocomplete="off" enterkeyhint="send" oninput="handleTyping()">
        <i class="fa-solid fa-paperclip" onclick="document.getElementById('fileInput').click()"></i>
      </div>
    </div>

    <div class="action-buttons-row">
      <div class="action-btn-circle" id="btnAudio" onmousedown="startRecording('audio')" onmouseup="stopRecording()" onmouseleave="stopRecording()" ontouchstart="startRecording('audio')" ontouchend="stopRecording()">
        <div class="icon-bg"><i class="fa-solid fa-microphone"></i></div>
        <span>Áudio</span>
      </div>
      <div class="action-btn-circle" onclick="startRecording('video')">
        <div class="icon-bg"><i class="fa-solid fa-video"></i></div>
        <span>Vídeo</span>
      </div>
      <div class="action-btn-circle" onclick="triggerFileUpload('audio/*')">
        <div class="icon-bg"><i class="fa-solid fa-music"></i></div>
        <span>Música</span>
      </div>
      <div class="action-btn-circle" onclick="triggerFileUpload('image/*')">
        <div class="icon-bg"><i class="fa-solid fa-image"></i></div>
        <span>Foto</span>
      </div>
      <div class="action-btn-circle" onclick="triggerFileUpload('*/*')">
        <div class="icon-bg"><i class="fa-solid fa-paperclip"></i></div>
        <span>Ficheiro</span>
      </div>
      <div class="action-btn-circle send" onclick="sendMessage()">
        <div class="icon-bg"><i class="fa-solid fa-paper-plane"></i></div>
        <span>Enviar</span>
      </div>
    </div>

    <input type="file" id="fileInput" accept="image/*,video/*" style="display: none;" onchange="uploadMedia(event)">
  </div>
  
  <div class="blocked-warning" id="blockedWarning">
    <i class="fa-solid fa-ban"></i> Bloqueaste este utilizador. Não podes enviar mensagens.
  </div>

  <div class="bottom-sheet-overlay" id="chatOptionsOverlay" onclick="closeChatOptions(event)">
    <div class="bottom-sheet" onclick="event.stopPropagation()">
      <div class="sheet-handle"></div>
      <div class="sheet-title">Opções da Conversa</div>
      <button class="sheet-btn" onclick="toggleMuteChat()" id="btnMuteChat">
        <i class="fa-solid fa-bell-slash"></i> Silenciar Notificações
      </button>
      <button class="sheet-btn danger" onclick="blockUser()" id="btnBlockUser">
        <i class="fa-solid fa-ban"></i> Bloquear Utilizador
      </button>
      <button class="sheet-btn danger" onclick="deleteEntireConversation()">
        <i class="fa-solid fa-trash"></i> Apagar Conversa Inteira
      </button>
      <button class="sheet-btn cancel" onclick="closeChatOptions()">Cancelar</button>
    </div>
  </div>

  <div class="bottom-sheet-overlay" id="messageOptionsOverlay" onclick="closeMessageOptions(event)">
    <div class="bottom-sheet" onclick="event.stopPropagation()">
      <div class="sheet-handle"></div>
      <div class="sheet-title">Opções da Mensagem</div>
      <button class="sheet-btn danger" onclick="confirmDeleteSingleMessage()">
        <i class="fa-solid fa-trash"></i> Apagar Mensagem
      </button>
      <button class="sheet-btn cancel" onclick="closeMessageOptions()">Cancelar</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/calls.js"></script>
  <script>
    const MAX_IMAGE_MB = 15;
    const MAX_VIDEO_MB = 50;
    const MAX_FILE_MB = 50;
    
    let currentUser = null;
    let sellerId = null;
    let myAvatarUrl = 'default-avatar.png';
    let otherAvatarUrl = 'default-avatar.png';
    let myLanguage = 'pt';
    let otherLanguage = 'pt';
    let realtimeChannel = null;
    let isSending = false;
    let isUploading = false;
    let typingTimeout = null;
    
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let recordingTimer = null;
    
    // Variáveis de Bloqueio (Fase 2 e 3)
    let isBlockedByMe = false;
    let isBlockedByThem = false;

    // Variáveis de Long Press
    let selectedMessageId = null;
    let selectedMessageSender = null;
    let pressTimer = null;

    const LANGS = { 'pt': 'Português', 'en': 'Inglês', 'es': 'Espanhol', 'fr': 'Francês', 'de': 'Alemão', 'it': 'Italiano', 'ru': 'Russo', 'ja': 'Japonês', 'zh-CN': 'Chinês', 'ar': 'Árabe', 'sw': 'Suaíli', 'ko': 'Coreano', 'nl': 'Holandês', 'tr': 'Turco', 'hi': 'Hindi' };

    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.className = `fly-toast ${type}`;
      toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> ${message}`;
      document.body.appendChild(toast);
      void toast.offsetWidth;
      toast.classList.add('show');
      setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3000);
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    function triggerFileUpload(acceptType) {
      const fileInput = document.getElementById('fileInput');
      fileInput.accept = acceptType;
      fileInput.click();
    }

    function updateKeyboardLanguage(langCode) {
      document.documentElement.lang = langCode;
      const input = document.getElementById('messageInput');
      if (input) input.setAttribute('lang', langCode);
    }

    function scrollToBottom(smooth = true) {
      const box = document.getElementById('chatMessages');
      if (!box) return;
      if (smooth) box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' });
      else box.scrollTop = box.scrollHeight;
    }

    function handleTyping() {
      if (!realtimeChannel) return;
      realtimeChannel.send({ type: 'broadcast', event: 'typing', payload: { user: currentUser } });
    }

    function startPressTimer(e, msgId, senderId) {
      if (!msgId) return;
      clearTimeout(pressTimer);
      pressTimer = setTimeout(() => {
        selectedMessageId = msgId;
        selectedMessageSender = senderId;
        document.getElementById('messageOptionsOverlay').style.display = 'flex';
      }, 600);
    }

    function clearPressTimer() {
      clearTimeout(pressTimer);
    }

    function closeMessageOptions(event) {
      if (event && event.target !== event.currentTarget) return;
      document.getElementById('messageOptionsOverlay').style.display = 'none';
      selectedMessageId = null;
      selectedMessageSender = null;
    }

    async function confirmDeleteSingleMessage() {
      const msgIdToDelete = selectedMessageId;
      const msgSender = selectedMessageSender;
      
      if (!msgIdToDelete) return;

      if (msgSender !== currentUser) {
        showToast('Só podes apagar as tuas próprias mensagens.', 'error');
        closeMessageOptions();
        return;
      }

      closeMessageOptions();

      const { error } = await supabaseClient.rpc('delete_single_message', {
        message_id: msgIdToDelete
      });

      if (error) {
        showToast('Erro ao apagar a mensagem: ' + error.message, 'error');
      } else {
        showToast('Mensagem apagada.', 'success');
        const row = document.getElementById(`msg-${msgIdToDelete}`);
        if (row) row.remove();
      }
    }

    async function checkBlockStatus() {
      const { data: iBlocked } = await supabaseClient.from('blocked_users').select('id').eq('blocker_id', currentUser).eq('blocked_id', sellerId).maybeSingle();
      const { data: theyBlocked } = await supabaseClient.from('blocked_users').select('id').eq('blocker_id', sellerId).eq('blocked_id', currentUser).maybeSingle();
      
      if (iBlocked) {
        isBlockedByMe = true;
        document.getElementById('chatInputArea').style.display = 'none';
        document.getElementById('blockedWarning').style.display = 'block';
        document.getElementById('btnBlockUser').innerHTML = '<i class="fa-solid fa-check"></i> Desbloquear Utilizador';
        document.getElementById('btnBlockUser').classList.remove('danger');
        document.getElementById('btnBlockUser').style.color = 'var(--success)';
      } else if (theyBlocked) {
        isBlockedByThem = true;
        document.getElementById('chatInputArea').style.display = 'none';
        document.getElementById('blockedWarning').innerHTML = '<i class="fa-solid fa-ban"></i> Este utilizador bloqueou-te. Não podes enviar mensagens.';
        document.getElementById('blockedWarning').style.display = 'block';
        document.getElementById('btnBlockUser').style.display = 'none';
      }
    }

    async function blockUser() {
      if (isBlockedByMe) {
        if (!confirm('Desbloquear este utilizador?')) return;
        await supabaseClient.from('blocked_users').delete().eq('blocker_id', currentUser).eq('blocked_id', sellerId);
        showToast('Utilizador desbloqueado.', 'success');
        closeChatOptions();
        setTimeout(() => window.location.reload(), 1000);
      } else {
        if (!confirm('Tens a certeza que queres bloquear este utilizador? Não poderás enviar mensagens.')) return;
        await supabaseClient.from('blocked_users').insert([{ blocker_id: currentUser, blocked_id: sellerId }]);
        showToast('Utilizador bloqueado.', 'success');
        closeChatOptions();
        setTimeout(() => window.location.reload(), 1000);
      }
    }

    async function deleteEntireConversation() {
      if (!confirm('Tens a certeza que queres apagar TODAS as mensagens desta conversa? Esta ação é irreparável.')) return;
      
      document.getElementById('chatMessages').innerHTML = '';
      closeChatOptions();

      const { error } = await supabaseClient.rpc('delete_conversation', { user1_id: currentUser, user2_id: sellerId });

      if (error) { 
        showToast('Erro ao apagar no banco de dados: ' + error.message, 'error'); 
        setTimeout(() => loadMessages(), 1500);
      } else { 
        showToast('Conversa apagada.', 'success'); 
        showEmptyState();
      }
    }

    function toggleMuteChat() {
      let mutedChats = JSON.parse(localStorage.getItem('fly_muted_chats') || '[]');
      if (mutedChats.includes(sellerId)) {
        mutedChats = mutedChats.filter(id => id !== sellerId);
        showToast('Notificações ativadas.', 'success');
        document.getElementById('btnMuteChat').innerHTML = '<i class="fa-solid fa-bell-slash"></i> Silenciar Notificações';
      } else {
        mutedChats.push(sellerId);
        showToast('Conversa silenciada.', 'success');
        document.getElementById('btnMuteChat').innerHTML = '<i class="fa-solid fa-bell"></i> Ativar Notificações';
      }
      localStorage.setItem('fly_muted_chats', JSON.stringify(mutedChats));
    }

    function openChatOptions() { 
      const mutedChats = JSON.parse(localStorage.getItem('fly_muted_chats') || '[]');
      if (mutedChats.includes(sellerId)) document.getElementById('btnMuteChat').innerHTML = '<i class="fa-solid fa-bell"></i> Ativar Notificações';
      document.getElementById('chatOptionsOverlay').style.display = 'flex'; 
    }
    
    function closeChatOptions(event) { 
      if (event && event.target !== event.currentTarget) return;
      document.getElementById('chatOptionsOverlay').style.display = 'none'; 
    }

    async function startRecording(type) {
      if (isUploading || isRecording || isSending) return;
      if (isBlockedByMe || isBlockedByThem) { showToast('Não podes enviar mensagens.', 'error'); return; }
      
      isRecording = true;
      audioChunks = [];
      document.getElementById('recordingText').innerText = type === 'video' ? 'A gravar vídeo...' : 'A gravar áudio...';
      document.getElementById('recordingStatus').style.display = 'flex';

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: type === 'video' ? { facingMode: 'user' } : false });
        const options = type === 'video' ? { mimeType: 'video/webm' } : { mimeType: 'audio/webm' };
        mediaRecorder = new MediaRecorder(stream, options);

        mediaRecorder.ondataavailable = event => { if (event.data.size > 0) audioChunks.push(event.data); };
        mediaRecorder.onstop = async () => {
          const blob = new Blob(audioChunks, { type: type === 'video' ? 'video/webm' : 'audio/webm' });
          const file = new File([blob], `record_${Date.now()}.webm`, { type: blob.type });
          stream.getTracks().forEach(track => track.stop());
          await uploadRecordedMedia(file, type);
        };

        mediaRecorder.start();
        recordingTimer = setTimeout(() => { if (mediaRecorder && mediaRecorder.state === 'recording') stopRecording(); }, 30000);
      } catch (err) {
        isRecording = false;
        document.getElementById('recordingStatus').style.display = 'none';
        showToast('Erro de permissão: ' + err.message, 'error');
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        clearTimeout(recordingTimer);
        document.getElementById('recordingStatus').style.display = 'none';
        isRecording = false;
      }
    }

    async function uploadRecordedMedia(file, type) {
      const fileName = `chats/${currentUser}_${Date.now()}_rec.webm`;
      const chatBox = document.getElementById('chatMessages');
      
      const tempRow = document.createElement('div');
      tempRow.className = 'message-row sent';
      tempRow.innerHTML = `<div class="message"><i class="fa-solid fa-spinner fa-spin"></i> A enviar ${type}...</div>`;
      chatBox.appendChild(tempRow);
      scrollToBottom(false);
      isUploading = true;

      const { error: uploadError } = await supabaseClient.storage.from('fly_bucket').upload(fileName, file, { cacheControl: '3600', upsert: false, contentType: file.type });
      
      if (uploadError) {
        tempRow.remove(); isUploading = false; showToast('Erro no upload.', 'error'); return;
      }

      const { data: publicUrl } = supabaseClient.storage.from('fly_bucket').getPublicUrl(fileName);
      const fileUrl = publicUrl.publicUrl;

      const { data: inserted, error: dbError } = await supabaseClient.from('messages').insert([{ sender_id: currentUser, receiver_id: sellerId, content: '', file_url: fileUrl, file_type: file.type, is_read: false }]).select().single();
      tempRow.remove(); isUploading = false;

      if (dbError) { showToast('Upload feito mas falhou gravar.', 'error'); return; }
      appendMessage(inserted);
      showToast('Enviado! ✅', 'success');
    }

    async function initChat() {
      const urlParams = new URLSearchParams(window.location.search);
      sellerId = urlParams.get('seller_id');
      if (!sellerId) { window.location.href = 'chat.html'; return; }

      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }
      currentUser = session.user.id;

      const { data: me } = await supabaseClient.from('profiles').select('avatar_url, language').eq('id', currentUser).single();
      if (me) {
        if (me.avatar_url) myAvatarUrl = me.avatar_url;
        if (me.language) { myLanguage = me.language; updateKeyboardLanguage(myLanguage); }
      }

      // ✅ BUSCAR DADOS DO OUTRO UTILIZADOR (Incluindo Privacidade)
      const { data: other } = await supabaseClient.from('profiles').select('username, avatar_url, language, message_privacy, hide_online_status').eq('id', sellerId).single();
      if (other) {
        if (other.avatar_url) otherAvatarUrl = other.avatar_url;
        if (other.language) otherLanguage = other.language;
        
        document.getElementById('chatSellerName').innerHTML = `${currentUser === sellerId ? 'Você' : other.username} <i class="fa-solid fa-circle-check" style="color: var(--neon); font-size: 0.8rem;"></i>`;
        document.getElementById('chatAvatar').src = otherAvatarUrl;

        // ✅ ESCONDER ONLINE (Fase 3)
        if (other.hide_online_status) {
          const statusEl = document.querySelector('.chat-status');
          statusEl.innerHTML = '<i class="fa-solid fa-circle" style="font-size:0.5rem; color:var(--text-muted);"></i> Offline';
          statusEl.style.color = 'var(--text-muted)';
          const dot = document.querySelector('.chat-status .dot');
          if (dot) dot.style.display = 'none';
        }
      }

      await checkBlockStatus();

      // ✅ VERIFICAR PRIVACIDADE DE MENSAGENS (Fase 3)
      // Só aplica se não houver bloqueio direto (Fase 2)
      if (!isBlockedByMe && !isBlockedByThem && other) {
        if (other.message_privacy === 'ninguem') {
          isBlockedByThem = true; // Reutilizamos a flag para bloquear envio
          document.getElementById('chatInputArea').style.display = 'none';
          document.getElementById('blockedWarning').innerHTML = '<i class="fa-solid fa-lock"></i> Este utilizador não aceita mensagens.';
          document.getElementById('blockedWarning').style.display = 'block';
        } else if (other.message_privacy === 'amigos') {
          // Verifica se são amigos
          const { data: friendship } = await supabaseClient.from('friendships').select('id').eq('status', 'aceite').or(`and(requester_id.eq.${currentUser},addressee_id.eq.${sellerId}),and(requester_id.eq.${sellerId},addressee_id.eq.${currentUser})`).maybeSingle();
          
          if (!friendship) {
            isBlockedByThem = true;
            document.getElementById('chatInputArea').style.display = 'none';
            document.getElementById('blockedWarning').innerHTML = '<i class="fa-solid fa-lock"></i> Este utilizador só aceita mensagens de amigos.';
            document.getElementById('blockedWarning').style.display = 'block';
          }
        }
      }

      await loadMessages();
      subscribeToRealtime();
      markAsRead();

      document.getElementById('messageInput').addEventListener('focus', () => { setTimeout(() => scrollToBottom(false), 300); });
      if (window.visualViewport) { window.visualViewport.addEventListener('resize', () => { setTimeout(() => scrollToBottom(false), 100); }); }
      window.addEventListener('beforeunload', () => { if (realtimeChannel) supabaseClient.removeChannel(realtimeChannel); });
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') markAsRead(); });
    }

    async function loadMessages() {
      const { data: messages, error } = await supabaseClient.from('messages').select('*').or(`and(sender_id.eq.${currentUser},receiver_id.eq.${sellerId}),and(sender_id.eq.${sellerId},receiver_id.eq.${currentUser})`).order('created_at', { ascending: true });
      if (error) { showToast('Erro ao carregar mensagens.', 'error'); return; }
      const chatBox = document.getElementById('chatMessages'); chatBox.innerHTML = '';
      if (!messages || messages.length === 0) { showEmptyState(); return; }
      for (const msg of messages) await appendMessage(msg);
      await markAsRead();
      setTimeout(() => scrollToBottom(false), 150);
    }

    function showEmptyState() {
      const chatBox = document.getElementById('chatMessages');
      chatBox.innerHTML = `<div class="empty-state"><i class="fa-regular fa-comments"></i><h3>Ainda não há mensagens</h3><p>Diz olá! 👋</p></div>`;
    }

    async function markAsRead() {
      if (document.visibilityState !== 'visible') return;
      await supabaseClient.from('messages').update({ is_read: true }).eq('receiver_id', currentUser).eq('sender_id', sellerId).eq('is_read', false);
    }

    async function appendMessage(msg) {
      const chatBox = document.getElementById('chatMessages');
      const emptyState = chatBox.querySelector('.empty-state');
      if (emptyState) chatBox.innerHTML = '';
      if (msg.id && document.getElementById(`msg-${msg.id}`)) return;

      const isSent = msg.sender_id === currentUser;
      const dateObj = msg.created_at ? new Date(msg.created_at) : new Date();
      const time = dateObj.toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' });

      const row = document.createElement('div');
      row.className = `message-row ${isSent ? 'sent' : 'received'}`;
      row.id = `msg-${msg.id || 'temp-' + Date.now()}`;
      
      if (msg.id) {
        row.onmousedown = (e) => startPressTimer(e, msg.id, msg.sender_id);
        row.onmouseup = clearPressTimer;
        row.onmouseleave = clearPressTimer;
        row.ontouchstart = (e) => startPressTimer(e, msg.id, msg.sender_id);
        row.ontouchend = clearPressTimer;
      }

      let contentHtml = '';
      if (msg.file_url) {
        const safeUrl = escapeHtml(msg.file_url);
        const type = msg.file_type || '';
        if (type.startsWith('image/')) { contentHtml = `<img src="${safeUrl}" class="message-image" onclick="window.open(this.src, '_blank')" alt="Imagem">`; } 
        else if (type.startsWith('video/')) { contentHtml = `<video src="${safeUrl}" controls playsinline preload="metadata" class="message-video"></video>`; } 
        else if (type.startsWith('audio/')) { contentHtml = `<audio src="${safeUrl}" controls class="message-audio"></audio>`; }
        else { contentHtml = `<a href="${safeUrl}" target="_blank" style="color:var(--neon); text-decoration:underline;">📎 Abrir ficheiro</a>`; }
      }

      const safeText = escapeHtml(msg.content || '');
      let textHtml = safeText ? `<div>${safeText}</div>` : '';
      const shouldTranslate = !isSent && myLanguage !== otherLanguage && msg.content && msg.content.trim().length > 0;

      if (shouldTranslate) {
        textHtml = `<div class="translated-tag" id="tag-${row.id}"><i class="fa-solid fa-spinner fa-spin"></i> A traduzir...</div><div class="translated-text" id="text-${row.id}">${safeText}</div>`;
      }

      let receiptHtml = '';
      if (isSent) {
        receiptHtml = msg.is_read ? '<i class="fa-solid fa-check-double read-receipt"></i>' : '<i class="fa-solid fa-check read-receipt" style="color: rgba(255,255,255,0.5);"></i>';
      }

      row.innerHTML = `
        ${!isSent ? `<img src="${escapeHtml(otherAvatarUrl)}" class="msg-avatar" alt="">` : ''}
        <div class="message">
          ${contentHtml}
          ${textHtml}
          <div class="message-footer">
            <span class="message-time">${time}</span>
            ${receiptHtml}
          </div>
        </div>
      `;
      chatBox.appendChild(row);
      scrollToBottom(false);

      if (shouldTranslate) { translateMessage(msg.content, otherLanguage, myLanguage, row.id); }
    }

    async function translateMessage(text, source, target, rowId) {
      try {
        const { data, error } = await supabaseClient.functions.invoke('translate-message', { body: { text, source, target } });
        const tag = document.getElementById(`tag-${rowId}`);
        const textDiv = document.getElementById(`text-${rowId}`);
        
        if (error || !data || data.error) { 
          if (tag) tag.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Falha na tradução`; 
          if (textDiv) textDiv.innerText = text; 
          return; 
        }
        if (tag) tag.innerHTML = `<i class="fa-solid fa-language"></i> Traduzido de ${LANGS[source] || source}`;
        if (textDiv) textDiv.innerText = data.translated || text;
      } catch (err) { 
        const tag = document.getElementById(`tag-${rowId}`); 
        if (tag) tag.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Erro`; 
      }
    }

    async function sendMessage() {
      if (isSending) return;
      if (isBlockedByMe || isBlockedByThem) { showToast('Não podes enviar mensagens.', 'error'); return; }
      
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;
      
      isSending = true; 
      const originalText = input.value;
      input.value = '';
      
      const { data: inserted, error } = await supabaseClient.from('messages').insert([{ sender_id: currentUser, receiver_id: sellerId, content: text, is_read: false }]).select().single();
      
      isSending = false; 
      if (error) { 
        input.value = originalText; 
        showToast('Falha ao enviar.', 'error'); 
        return; 
      }
      appendMessage(inserted);
    }

    async function uploadMedia(event) {
      const file = event.target.files[0];
      if (!file) return;
      if (isUploading) { showToast('Já tens um ficheiro a enviar...', 'error'); event.target.value = ''; return; }
      if (isBlockedByMe || isBlockedByThem) { showToast('Não podes enviar mensagens.', 'error'); event.target.value = ''; return; }
      
      const isImage = file.type.startsWith('image/');
      const isVideo = file.type.startsWith('video/');
      const sizeMB = file.size / 1024 / 1024;
      const limitMB = isVideo ? MAX_VIDEO_MB : (isImage ? MAX_IMAGE_MB : MAX_FILE_MB);
      
      if (sizeMB > limitMB) { showToast(`Ficheiro muito grande (${sizeMB.toFixed(2)}MB). Máx: ${limitMB}MB.`, 'error'); event.target.value = ''; return; }

      let fileExt = file.name.split('.').pop().toLowerCase();
      if (!fileExt || fileExt.length > 5) fileExt = isVideo ? 'mp4' : (isImage ? 'jpg' : 'file');

      const fileName = `chats/${currentUser}_${Date.now()}.${fileExt}`;
      const chatBox = document.getElementById('chatMessages');
      
      const tempRow = document.createElement('div');
      tempRow.className = 'message-row sent';
      tempRow.innerHTML = `<div class="message"><i class="fa-solid fa-spinner fa-spin"></i> A enviar...</div>`;
      chatBox.appendChild(tempRow);
      scrollToBottom(false);
      isUploading = true;

      const { error: uploadError } = await supabaseClient.storage.from('fly_bucket').upload(fileName, file, { cacheControl: '3600', upsert: false, contentType: file.type });
      
      if (uploadError) {
        tempRow.remove(); isUploading = false; event.target.value = ''; showToast('Erro no upload.', 'error'); return;
      }

      const { data: publicUrl } = supabaseClient.storage.from('fly_bucket').getPublicUrl(fileName);
      const fileUrl = publicUrl.publicUrl;

      const { data: inserted, error: dbError } = await supabaseClient.from('messages').insert([{ sender_id: currentUser, receiver_id: sellerId, content: '', file_url: fileUrl, file_type: file.type, is_read: false }]).select().single();
      tempRow.remove(); isUploading = false; event.target.value = '';

      if (dbError) { showToast('Upload feito mas falhou gravar.', 'error'); return; }
      appendMessage(inserted);
      showToast('Enviado! ✅', 'success');
    }

    async function startCall(type) {
      if (!currentUser || !sellerId) return;
      if (isBlockedByMe || isBlockedByThem) { showToast('Não podes ligar para este utilizador.', 'error'); return; }
      const { data: call, error } = await supabaseClient.from('calls').insert([{ caller_id: currentUser, receiver_id: sellerId, type, status: 'ringing' }]).select().single();
      if (error || !call) { showToast('Não foi possível iniciar a chamada.', 'error'); return; }
      window.location.href = `chamada.html?user_id=${sellerId}&type=${type}&call_id=${call.id}&role=caller`;
    }
    
    function handleKeyPress(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }

    function subscribeToRealtime() {
      realtimeChannel = supabaseClient.channel('chat-room-' + currentUser + '-' + sellerId)
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
          const newMsg = payload.new;
          const isThisConversation = (newMsg.sender_id === sellerId && newMsg.receiver_id === currentUser) || (newMsg.sender_id === currentUser && newMsg.receiver_id === sellerId);
          if (!isThisConversation) return;
          if (newMsg.sender_id === currentUser) return;
          if (document.getElementById(`msg-${newMsg.id}`)) return;
          appendMessage(newMsg);
          markAsRead();
        })
        .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages' }, (payload) => {
          const deletedMsg = payload.old;
          const row = document.getElementById(`msg-${deletedMsg.id}`);
          if (row) row.remove();
        })
        .on('broadcast', { event: 'typing' }, (payload) => {
          if (payload.payload.user === sellerId) {
            const typingIndicator = document.getElementById('typingIndicator');
            typingIndicator.style.display = 'flex';
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => { typingIndicator.style.display = 'none'; }, 3000);
          }
        })
        .subscribe();
    }

    initChat();
  </script>
</body>
</html>
