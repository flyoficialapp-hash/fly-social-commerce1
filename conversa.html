<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>FLY - Chat</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --chat-bg: #050b14;
      --sent-bg: #0055ff;
      --received-bg: rgba(10, 25, 50, 0.6);
      --input-bg: rgba(10, 25, 50, 0.9);
    }

    html, body { height: 100vh; height: 100dvh; margin: 0; padding: 0; overflow: hidden; overscroll-behavior: none; background: var(--chat-bg); }
    body { display: flex; flex-direction: column; font-family: 'Inter', sans-serif; }

    /* HEADER */
    .chat-header { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 10px 15px; background: rgba(3, 7, 18, 0.95); border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 10; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-left i { font-size: 1.5rem; cursor: pointer; color: white; }
    .chat-avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid var(--neon); }
    .chat-user-info { display: flex; flex-direction: column; }
    .chat-user-name { font-weight: bold; font-size: 1rem; color: white; display: flex; align-items: center; gap: 5px; }
    .chat-status { font-size: 0.75rem; color: var(--success); display: flex; align-items: center; gap: 4px; }
    .chat-status .dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; box-shadow: 0 0 5px var(--success); }
    
    .header-actions { display: flex; gap: 12px; }
    .header-actions i { font-size: 1.3rem; cursor: pointer; width: 35px; height: 35px; display: flex; justify-content: center; align-items: center; border-radius: 50%; }
    .header-actions .phone { color: #00e676; background: rgba(0, 230, 118, 0.15); }
    .header-actions .video { color: #00ccff; background: rgba(0, 204, 255, 0.15); }
    .header-actions .more { color: white; background: rgba(255, 255, 255, 0.1); }

    /* CHAT MESSAGES */
    .chat-messages { flex: 1; min-height: 0; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
    .message-row { display: flex; align-items: flex-end; gap: 8px; max-width: 85%; }
    .message-row.sent { align-self: flex-end; flex-direction: row-reverse; }
    .message-row.received { align-self: flex-start; }
    .msg-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1px solid var(--glass-border); margin-bottom: 18px;}
    .message { padding: 12px 16px; border-radius: 18px; font-size: 0.95rem; line-height: 1.4; position: relative; word-wrap: break-word; overflow-wrap: break-word; max-width: 100%; color: white; }
    .message-row.sent .message { background: var(--sent-bg); border-bottom-right-radius: 4px; }
    .message-row.received .message { background: var(--received-bg); border: 1px solid var(--glass-border); border-bottom-left-radius: 4px; }
    
    .message-image { max-width: 100%; border-radius: 12px; margin-bottom: 5px; cursor: pointer; display: block; }
    .message-video { max-width: 100%; border-radius: 12px; margin-bottom: 5px; display: block; background: #000; }
    .message-audio { max-width: 100%; margin-bottom: 5px; display: block; }
    
    .message-footer { display: flex; justify-content: flex-end; align-items: center; gap: 5px; margin-top: 5px; }
    .message-time { font-size: 0.65rem; color: rgba(255,255,255,0.6); }
    .read-receipt { font-size: 0.75rem; color: #fff; }
    
    .translated-tag { display: inline-block; font-size: 0.65rem; color: #a855f7; background: rgba(168, 85, 247, 0.15); padding: 2px 6px; border-radius: 4px; margin-bottom: 5px; font-weight: bold; }
    .translated-text { font-style: italic; color: #e0e0e0; }
    
    .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); text-align: center; padding: 40px 20px; }
    .empty-state i { font-size: 3rem; margin-bottom: 15px; opacity: 0.5; color: var(--neon); }
    .empty-state h3 { color: white; margin-bottom: 8px; font-size: 1.1rem; }

    /* TYPING INDICATOR */
    .typing-indicator { display: none; align-items: center; gap: 4px; padding: 10px 15px; background: var(--received-bg); border-radius: 18px; border-bottom-left-radius: 4px; width: fit-content; margin-bottom: 15px; }
    .typing-indicator span { width: 6px; height: 6px; background: rgba(255,255,255,0.6); border-radius: 50%; display: inline-block; animation: typing 1.4s infinite ease-in-out both; }
    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

    /* INPUT AREA (A PARTE DE BAIXO) */
    .chat-bottom-area { flex-shrink: 0; background: rgba(3, 7, 18, 0.95); border-top: 1px solid rgba(255,255,255,0.05); padding: 10px 15px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 20; display: flex; flex-direction: column; gap: 12px; }

    /* Input de texto */
    .text-input-row { display: flex; gap: 10px; align-items: center; }
    .text-input-wrapper { flex: 1; display: flex; align-items: center; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 25px; padding: 5px 15px; }
    .text-input-wrapper i { color: var(--text-muted); font-size: 1.3rem; cursor: pointer; padding: 5px; }
    .chat-input { flex: 1; min-width: 0; background: transparent; border: none; padding: 10px; color: white; outline: none; font-size: 0.95rem; }

    /* Fila de botões grandes */
    .action-buttons-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; overflow-x: auto; scrollbar-width: none; }
    .action-buttons-row::-webkit-scrollbar { display: none; }
    
    .action-btn-circle { display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; min-width: 55px; }
    .action-btn-circle .icon-bg { width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: center; align-items: center; font-size: 1.3rem; color: white; transition: 0.2s; }
    .action-btn-circle:hover .icon-bg { background: rgba(255,255,255,0.1); }
    .action-btn-circle span { font-size: 0.7rem; color: var(--text-muted); }
    
    .action-btn-circle.send .icon-bg { background: var(--primary); border-color: var(--neon); font-size: 1.5rem; box-shadow: 0 0 15px rgba(0, 204, 255, 0.4); }
    .action-btn-circle.send span { color: var(--primary); font-weight: bold; }
  </style>
</head>
<body>
  <header class="chat-header">
    <div class="header-left">
      <i class="fa-solid fa-arrow-left" onclick="window.location.href='chat.html'"></i>
      <img id="chatAvatar" src="default-avatar.png" class="chat-avatar" alt="Avatar">
      <div class="chat-user-info">
        <div id="chatSellerName" class="chat-user-name">A carregar... <i class="fa-solid fa-circle-check" style="color: var(--neon); font-size: 0.8rem;"></i></div>
        <div class="chat-status"><div class="dot"></div> Online agora</div>
      </div>
    </div>
    <div class="header-actions">
      <i class="fa-solid fa-phone phone" onclick="startCall('audio')"></i>
      <i class="fa-solid fa-video video" onclick="startCall('video')"></i>
      <i class="fa-solid fa-ellipsis-vertical more"></i>
    </div>
  </header>

  <div class="chat-messages" id="chatMessages"></div>
  
  <!-- Indicador de A Digitar -->
  <div class="typing-indicator" id="typingIndicator">
    <span></span><span></span><span></span>
  </div>

  <div class="chat-bottom-area">
    <!-- Input de Texto -->
    <div class="text-input-row">
      <div class="text-input-wrapper">
        <i class="fa-regular fa-face-smile" onclick="toggleEmojiPanel()"></i>
        <input type="text" id="messageInput" class="chat-input" placeholder="Escreva a sua mensagem..." onkeypress="handleKeyPress(event)" autocomplete="off" enterkeyhint="send" oninput="handleTyping()">
        <i class="fa-solid fa-paperclip" onclick="document.getElementById('fileInput').click()"></i>
      </div>
    </div>

    <!-- Fila de Botões -->
    <div class="action-buttons-row">
      <div class="action-btn-circle" onclick="triggerFileUpload('audio/*')">
        <div class="icon-bg"><i class="fa-solid fa-microphone"></i></div>
        <span>Áudio</span>
      </div>
      <div class="action-btn-circle" onclick="triggerFileUpload('video/*')">
        <div class="icon-bg"><i class="fa-solid fa-video"></i></div>
        <span>Vídeo</span>
      </div>
      <div class="action-btn-circle" onclick="triggerFileUpload('audio/*')">
        <div class="icon-bg"><i class="fa-solid fa-music"></i></div>
        <span>Música</span>
      </div>
      <div class="action-btn-circle" onclick="triggerFileUpload('image/*')">
        <div class="icon-bg"><i class="fa-solid fa-image"></i></div>
        <span>Foto</span>
      </div>
      <div class="action-btn-circle" onclick="triggerFileUpload('*/*')">
        <div class="icon-bg"><i class="fa-solid fa-paperclip"></i></div>
        <span>Ficheiro</span>
      </div>
      <div class="action-btn-circle send" onclick="sendMessage()">
        <div class="icon-bg"><i class="fa-solid fa-paper-plane"></i></div>
        <span>Enviar</span>
      </div>
    </div>

    <input type="file" id="fileInput" accept="image/*,video/*" style="display: none;" onchange="uploadMedia(event)">
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/calls.js"></script>
  <script>
    const MAX_IMAGE_MB = 15;
    const MAX_VIDEO_MB = 50;
    const MAX_FILE_MB = 50;
    
    let currentUser = null;
    let sellerId = null;
    let myAvatarUrl = 'default-avatar.png';
    let otherAvatarUrl = 'default-avatar.png';
    let myLanguage = 'pt';
    let otherLanguage = 'pt';
    let realtimeChannel = null;
    let isSending = false;
    let isUploading = false;
    let typingTimeout = null;

    const LANGS = {
      'pt': 'Português', 'en': 'Inglês', 'es': 'Espanhol', 'fr': 'Francês',
      'de': 'Alemão', 'it': 'Italiano', 'ru': 'Russo', 'ja': 'Japonês',
      'zh-CN': 'Chinês', 'ar': 'Árabe', 'sw': 'Suaíli', 'ko': 'Coreano',
      'nl': 'Holandês', 'tr': 'Turco', 'hi': 'Hindi'
    };

    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.className = `fly-toast ${type}`;
      toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> ${message}`;
      document.body.appendChild(toast);
      void toast.offsetWidth;
      toast.classList.add('show');
      setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3000);
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    function triggerFileUpload(acceptType) {
      const fileInput = document.getElementById('fileInput');
      fileInput.accept = acceptType;
      fileInput.click();
    }

    function updateKeyboardLanguage(langCode) {
      document.documentElement.lang = langCode;
      const input = document.getElementById('messageInput');
      if (input) input.setAttribute('lang', langCode);
    }

    function scrollToBottom(smooth = true) {
      const box = document.getElementById('chatMessages');
      if (!box) return;
      if (smooth) box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' });
      else box.scrollTop = box.scrollHeight;
    }

    // ---- Lógica de "A Digitar..." ----
    function handleTyping() {
      if (!realtimeChannel) return;
      realtimeChannel.send({ type: 'broadcast', event: 'typing', payload: { user: currentUser } });
    }

    async function initChat() {
      const urlParams = new URLSearchParams(window.location.search);
      sellerId = urlParams.get('seller_id');
      if (!sellerId) { window.location.href = 'chat.html'; return; }

      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }
      currentUser = session.user.id;

      const { data: me } = await supabaseClient.from('profiles').select('avatar_url, language').eq('id', currentUser).single();
      if (me) {
        if (me.avatar_url) myAvatarUrl = me.avatar_url;
        if (me.language) { myLanguage = me.language; updateKeyboardLanguage(myLanguage); }
      }

      const { data: other } = await supabaseClient.from('profiles').select('username, avatar_url, language').eq('id', sellerId).single();
      if (other) {
        if (other.avatar_url) otherAvatarUrl = other.avatar_url;
        if (other.language) otherLanguage = other.language;
        document.getElementById('chatSellerName').innerHTML = `${currentUser === sellerId ? 'Você' : other.username} <i class="fa-solid fa-circle-check" style="color: var(--neon); font-size: 0.8rem;"></i>`;
        document.getElementById('chatAvatar').src = otherAvatarUrl;
      }

      await loadMessages();
      subscribeToRealtime();
      markAsRead();

      document.getElementById('messageInput').addEventListener('focus', () => { setTimeout(() => scrollToBottom(false), 300); });
      if (window.visualViewport) { window.visualViewport.addEventListener('resize', () => { setTimeout(() => scrollToBottom(false), 100); }); }
      window.addEventListener('beforeunload', () => { if (realtimeChannel) supabaseClient.removeChannel(realtimeChannel); });
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') markAsRead(); });
    }

    async function loadMessages() {
      const { data: messages, error } = await supabaseClient.from('messages').select('*').or(`and(sender_id.eq.${currentUser},receiver_id.eq.${sellerId}),and(sender_id.eq.${sellerId},receiver_id.eq.${currentUser})`).order('created_at', { ascending: true });
      if (error) { showToast('Erro ao carregar mensagens.', 'error'); return; }
      const chatBox = document.getElementById('chatMessages'); chatBox.innerHTML = '';
      if (!messages || messages.length === 0) { showEmptyState(); return; }
      for (const msg of messages) await appendMessage(msg);
      await markAsRead();
      setTimeout(() => scrollToBottom(false), 150);
    }

    function showEmptyState() {
      const chatBox = document.getElementById('chatMessages');
      chatBox.innerHTML = `<div class="empty-state"><i class="fa-regular fa-comments"></i><h3>Ainda não há mensagens</h3><p>Diz olá! 👋</p></div>`;
    }

    async function markAsRead() {
      if (document.visibilityState !== 'visible') return;
      await supabaseClient.from('messages').update({ is_read: true }).eq('receiver_id', currentUser).eq('sender_id', sellerId).eq('is_read', false);
    }

    async function appendMessage(msg) {
      const chatBox = document.getElementById('chatMessages');
      const emptyState = chatBox.querySelector('.empty-state');
      if (emptyState) chatBox.innerHTML = '';
      if (msg.id && document.getElementById(`msg-${msg.id}`)) return;

      const isSent = msg.sender_id === currentUser;
      const dateObj = msg.created_at ? new Date(msg.created_at) : new Date();
      const time = dateObj.toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' });

      const row = document.createElement('div');
      row.className = `message-row ${isSent ? 'sent' : 'received'}`;
      row.id = `msg-${msg.id || 'temp-' + Date.now()}`;

      let contentHtml = '';
      if (msg.file_url) {
        const safeUrl = escapeHtml(msg.file_url);
        const type = msg.file_type || '';
        if (type.startsWith('image/')) { contentHtml = `<img src="${safeUrl}" class="message-image" onclick="window.open(this.src, '_blank')" alt="Imagem">`; } 
        else if (type.startsWith('video/')) { contentHtml = `<video src="${safeUrl}" controls playsinline preload="metadata" class="message-video"></video>`; } 
        else if (type.startsWith('audio/')) { contentHtml = `<audio src="${safeUrl}" controls class="message-audio"></audio>`; }
        else { contentHtml = `<a href="${safeUrl}" target="_blank" style="color:var(--neon); text-decoration:underline; display:flex; align-items:center; gap:5px;"><i class="fa-solid fa-file"></i> Abrir ficheiro</a>`; }
      }

      const safeText = escapeHtml(msg.content || '');
      let textHtml = safeText ? `<div>${safeText}</div>` : '';
      const shouldTranslate = !isSent && myLanguage !== otherLanguage && msg.content && msg.content.trim().length > 0;

      if (shouldTranslate) {
        textHtml = `<div class="translated-tag" id="tag-${row.id}"><i class="fa-solid fa-spinner fa-spin"></i> A traduzir...</div><div class="translated-text" id="text-${row.id}">${safeText}</div>`;
      }

      // Visto duplo (Read receipt) para mensagens enviadas
      let receiptHtml = '';
      if (isSent) {
        receiptHtml = msg.is_read ? '<i class="fa-solid fa-check-double read-receipt"></i>' : '<i class="fa-solid fa-check read-receipt" style="color: rgba(255,255,255,0.5);"></i>';
      }

      row.innerHTML = `
        ${!isSent ? `<img src="${escapeHtml(otherAvatarUrl)}" class="msg-avatar" alt="">` : ''}
        <div class="message">
          ${contentHtml}
          ${textHtml}
          <div class="message-footer">
            <span class="message-time">${time}</span>
            ${receiptHtml}
          </div>
        </div>
      `;
      chatBox.appendChild(row);
      scrollToBottom(false);

      if (shouldTranslate) { translateMessage(msg.content, otherLanguage, myLanguage, row.id); }
    }

    async function translateMessage(text, source, target, rowId) {
      try {
        const { data, error } = await supabaseClient.functions.invoke('translate-message', { body: { text, source, target } });
        const tag = document.getElementById(`tag-${rowId}`);
        const textDiv = document.getElementById(`text-${rowId}`);
        
        if (error || !data || data.error) { 
          if (tag) tag.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Falha na tradução`; 
          if (textDiv) textDiv.innerText = text; 
          return; 
        }
        if (tag) tag.innerHTML = `<i class="fa-solid fa-language"></i> Traduzido de ${LANGS[source] || source}`;
        if (textDiv) textDiv.innerText = data.translated || text;
      } catch (err) { 
        const tag = document.getElementById(`tag-${rowId}`); 
        if (tag) tag.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Erro`; 
      }
    }

    async function sendMessage() {
      if (isSending) return;
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;
      
      const btn = document.getElementById('btnSend');
      isSending = true; 
      const originalText = input.value;
      input.value = '';
      
      const { data: inserted, error } = await supabaseClient.from('messages').insert([{ sender_id: currentUser, receiver_id: sellerId, content: text, is_read: false }]).select().single();
      
      isSending = false; 
      if (error) { 
        input.value = originalText; 
        showToast('Falha ao enviar.', 'error'); 
        return; 
      }
      appendMessage(inserted);
    }

    async function uploadMedia(event) {
      const file = event.target.files[0];
      if (!file) return;
      if (isUploading) { showToast('Já tens um ficheiro a enviar...', 'error'); event.target.value = ''; return; }
      
      const isImage = file.type.startsWith('image/');
      const isVideo = file.type.startsWith('video/');
      const sizeMB = file.size / 1024 / 1024;
      const limitMB = isVideo ? MAX_VIDEO_MB : (isImage ? MAX_IMAGE_MB : MAX_FILE_MB);
      
      if (sizeMB > limitMB) { showToast(`Ficheiro muito grande (${sizeMB.toFixed(2)}MB). Máx: ${limitMB}MB.`, 'error'); event.target.value = ''; return; }

      let fileExt = file.name.split('.').pop().toLowerCase();
      if (!fileExt || fileExt.length > 5) fileExt = isVideo ? 'mp4' : (isImage ? 'jpg' : 'file');

      const fileName = `chats/${currentUser}_${Date.now()}.${fileExt}`;
      const chatBox = document.getElementById('chatMessages');
      
      const tempRow = document.createElement('div');
      tempRow.className = 'message-row sent';
      tempRow.innerHTML = `<div class="message"><i class="fa-solid fa-spinner fa-spin"></i> A enviar...</div>`;
      chatBox.appendChild(tempRow);
      scrollToBottom(false);
      isUploading = true;

      const { error: uploadError } = await supabaseClient.storage.from('fly_bucket').upload(fileName, file, { cacheControl: '3600', upsert: false, contentType: file.type });
      
      if (uploadError) {
        tempRow.remove(); isUploading = false; event.target.value = ''; showToast('Erro no upload.', 'error'); return;
      }

      const { data: publicUrl } = supabaseClient.storage.from('fly_bucket').getPublicUrl(fileName);
      const fileUrl = publicUrl.publicUrl;

      const { data: inserted, error: dbError } = await supabaseClient.from('messages').insert([{ sender_id: currentUser, receiver_id: sellerId, content: '', file_url: fileUrl, file_type: file.type, is_read: false }]).select().single();
      tempRow.remove(); isUploading = false; event.target.value = '';

      if (dbError) { showToast('Upload feito mas falhou gravar na BD.', 'error'); return; }
      appendMessage(inserted);
      showToast('Enviado! ✅', 'success');
    }

    async function startCall(type) {
      if (!currentUser || !sellerId) return;
      const { data: call, error } = await supabaseClient.from('calls').insert([{ caller_id: currentUser, receiver_id: sellerId, type, status: 'ringing' }]).select().single();
      if (error || !call) { showToast('Não foi possível iniciar a chamada.', 'error'); return; }
      window.location.href = `chamada.html?user_id=${sellerId}&type=${type}&call_id=${call.id}&role=caller`;
    }
    
    function handleKeyPress(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }

    function subscribeToRealtime() {
      realtimeChannel = supabaseClient.channel('chat-room-' + currentUser + '-' + sellerId)
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
          const newMsg = payload.new;
          const isThisConversation = (newMsg.sender_id === sellerId && newMsg.receiver_id === currentUser) || (newMsg.sender_id === currentUser && newMsg.receiver_id === sellerId);
          if (!isThisConversation) return;
          if (newMsg.sender_id === currentUser) return;
          if (document.getElementById(`msg-${newMsg.id}`)) return;
          appendMessage(newMsg);
          markAsRead();
        })
        .on('broadcast', { event: 'typing' }, (payload) => {
          if (payload.payload.user === sellerId) {
            const typingIndicator = document.getElementById('typingIndicator');
            typingIndicator.style.display = 'flex';
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => { typingIndicator.style.display = 'none'; }, 3000);
          }
        })
        .subscribe();
    }

    initChat();
  </script>
</body>
</html>
