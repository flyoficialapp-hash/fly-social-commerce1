<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLY - Notificações</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    .header-title { font-size: 1.2rem; font-weight: bold; display: flex; align-items: center; gap: 10px; color: white;}
    .header-title img { height: 30px; border-radius: 5px;}
    .tabs { display: flex; border-bottom: 1px solid var(--glass-border); padding: 0 15px; }
    .tab { flex: 1; text-align: center; padding: 15px 0; color: var(--text-muted); font-weight: bold; cursor: pointer; transition: 0.2s; border-bottom: 2px solid transparent; }
    .tab.active { color: var(--neon); border-bottom-color: var(--neon); }
    .notif-container { padding: 15px; padding-bottom: 90px; }
    
    .notif-card { display: flex; align-items: center; gap: 15px; padding: 15px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 15px; margin-bottom: 10px; cursor: pointer;}
    .notif-avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid var(--neon); background: #000;}
    .notif-info { flex: 1; }
    .notif-info p { font-size: 0.95rem; color: white; line-height: 1.3; }
    .notif-info strong { color: var(--neon); }
    .notif-time { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; display: block;}
    .notif-indicator { width: 8px; height: 8px; background: var(--primary); border-radius: 50%; box-shadow: 0 0 5px var(--primary); }

    .friend-request { display: flex; flex-direction: column; gap: 10px; padding: 15px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 15px; margin-bottom: 15px; }
    .friend-request-top { display: flex; align-items: center; gap: 15px; }
    .friend-actions { display: flex; gap: 10px; margin-top: 5px; }
    .btn-accept { flex: 1; padding: 10px; border-radius: 10px; border: none; background: var(--primary); color: white; font-weight: bold; cursor: pointer; }
    .btn-decline { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--glass-border); background: transparent; color: white; font-weight: bold; cursor: pointer; }
    .btn-accept:hover { background: var(--neon); color: #000; }
    .empty-state { text-align: center; color: var(--text-muted); padding: 40px 20px; }
    .empty-state i { font-size: 3rem; margin-bottom: 15px; opacity: 0.5; }
  </style>
</head>
<body>

  <header class="header">
    <i class="fa-solid fa-arrow-left" onclick="window.location.href='home.html'" style="font-size: 1.5rem; cursor: pointer;"></i>
    <div class="header-title"><img src="logo.png" alt="FLY"> Atividade</div>
    <div style="width: 24px;"></div>
  </header>

  <div class="tabs">
    <div class="tab active" id="tab-geral" onclick="switchTab('geral')">Geral</div>
    <div class="tab" id="tab-pedidos" onclick="switchTab('pedidos')">Pedidos <span id="badgeRequests" style="background:var(--danger); color:white; padding:2px 6px; border-radius:10px; font-size:0.7rem; display:none;">0</span></div>
  </div>

  <div class="notif-container" id="contentArea"><p style="text-align: center; color: var(--text-muted); margin-top: 20px;">A carregar...</p></div>

  <nav class="bottom-nav">
    <a href="home.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Início</span></a>
    <a href="mercado.html" class="nav-item"><i class="fa-solid fa-bag-shopping"></i><span>Mercado</span></a>
    <a href="chat.html" class="nav-item"><i class="fa-solid fa-comment-dots"></i><span>Chat</span><span class="nav-badge" id="chat-badge">0</span></a>
    <a href="gerenciar_vendas.html" class="nav-item"><i class="fa-solid fa-briefcase"></i><span>Negócio</span><span class="nav-badge" id="negocio-badge">0</span></a>
    <a href="perfil.html" class="nav-item"><i class="fa-solid fa-user"></i><span>Perfil</span></a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script>
    let currentUser = null; let currentTab = 'geral';

    async function updateBadges() {
      if (!currentUser) return;
      const { count: chatCount } = await supabaseClient.from('messages').select('*', { count: 'exact', head: true }).eq('receiver_id', currentUser).eq('is_read', false);
      const chatBadge = document.getElementById('chat-badge');
      if (chatBadge) { if (chatCount > 0) { chatBadge.innerText = chatCount; chatBadge.style.display = 'flex'; } else { chatBadge.style.display = 'none'; } }

      const { count: orderCount } = await supabaseClient.from('orders').select('*', { count: 'exact', head: true }).eq('seller_id', currentUser).eq('status', 'pendente');
      const negocioBadge = document.getElementById('negocio-badge');
      if (negocioBadge) { if (orderCount > 0) { negocioBadge.innerText = orderCount; negocioBadge.style.display = 'flex'; } else { negocioBadge.style.display = 'none'; } }

      const { count: reqCount } = await supabaseClient.from('friendships').select('*', { count: 'exact', head: true }).eq('addressee_id', currentUser).eq('status', 'pendente');
      const badgeRequests = document.getElementById('badgeRequests');
      if (badgeRequests) { if (reqCount > 0) { badgeRequests.innerText = reqCount; badgeRequests.style.display = 'inline-block'; } else { badgeRequests.style.display = 'none'; } }
    }

    async function init() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }
      currentUser = session.user.id;
      updateBadges(); setInterval(updateBadges, 10000);
      loadContent();
    }

    function switchTab(tab) { currentTab = tab; document.getElementById('tab-geral').classList.toggle('active', tab === 'geral'); document.getElementById('tab-pedidos').classList.toggle('active', tab === 'pedidos'); loadContent(); }

    async function loadContent() {
      const area = document.getElementById('contentArea');
      area.innerHTML = '<p style="text-align: center; color: var(--text-muted); margin-top: 20px;">A carregar...</p>';

      if (currentTab === 'geral') {
        const { data: notifs, error } = await supabaseClient.from('notifications').select(`*, profiles:sender_id ( username, avatar_url )`).eq('user_id', currentUser).order('created_at', { ascending: false }).limit(50);
        if (error || !notifs || notifs.length === 0) { area.innerHTML = `<div class="empty-state"><i class="fa-regular fa-bell-slash"></i><p>Ainda não tens notificações.</p></div>`; return; }
        area.innerHTML = '';
        notifs.forEach(n => {
          const senderName = n.profiles ? n.profiles.username : 'Alguém';
          const avatar = n.profiles && n.profiles.avatar_url ? n.profiles.avatar_url : 'default-avatar.png'; // Alterado
          const time = new Date(n.created_at).toLocaleDateString('pt-PT');
          
          let text = "interagiu contigo.";
          if (n.type === 'like') text = "gostou da tua publicação. ❤️";
          if (n.type === 'comment') text = "comentou na tua publicação. 💬";
          if (n.type === 'order') text = "fez um novo pedido! 💰";
          if (n.type === 'follow') text = "começou a seguir-te. 👥";
          if (n.type === 'friend') text = "enviou-te um pedido de amizade. 🤝";

          area.innerHTML += `
            <div class="notif-card" style="${n.is_read ? 'opacity: 0.6;' : ''}" onclick="window.location.href='perfil.html?id=${n.sender_id}'">
              <img src="${avatar}" class="notif-avatar">
              <div class="notif-info"><p><strong>${senderName}</strong> ${text}</p><span class="notif-time">${time}</span></div>
              ${!n.is_read ? '<div class="notif-indicator"></div>' : ''}
            </div>`;
        });
        await supabaseClient.from('notifications').update({ is_read: true }).eq('user_id', currentUser);
      } else {
        const { data: requests, error } = await supabaseClient.from('friendships').select(`id, requester_id, profiles:requester_id ( username, avatar_url )`).eq('addressee_id', currentUser).eq('status', 'pendente').order('created_at', { ascending: false });
        if (error || !requests || requests.length === 0) { area.innerHTML = `<div class="empty-state"><i class="fa-solid fa-user-group"></i><p>Não tens pedidos de amizade pendentes.</p></div>`; return; }
        area.innerHTML = '';
        requests.forEach(req => {
          const name = req.profiles ? req.profiles.username : 'Utilizador';
          const avatar = req.profiles && req.profiles.avatar_url ? req.profiles.avatar_url : 'default-avatar.png'; // Alterado
          area.innerHTML += `
            <div class="friend-request">
              <div class="friend-request-top">
                <img src="${avatar}" class="notif-avatar">
                <div class="notif-info"><p><strong>${name}</strong> quer ser teu amigo.</p><span class="notif-time">Pedido de Amizade</span></div>
              </div>
              <div class="friend-actions">
                <button class="btn-decline" onclick="respondRequest('${req.id}', 'recusar')">Recusar</button>
                <button class="btn-accept" onclick="respondRequest('${req.id}', 'aceitar', '${req.requester_id}')">Aceitar</button>
              </div>
            </div>`;
        });
      }
    }

    async function respondRequest(requestId, action, requesterId) {
      if (action === 'aceitar') {
        await supabaseClient.from('friendships').update({ status: 'aceite' }).eq('id', requestId);
        await supabaseClient.from('notifications').insert([{ user_id: requesterId, sender_id: currentUser, type: 'friend' }]);
        alert('Agora são amigos no FLY! 🤝');
      } else { await supabaseClient.from('friendships').delete().eq('id', requestId); }
      loadContent();
    }

    init();
  </script>
</body>
</html>
