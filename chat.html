<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLY - Chat</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: rgba(3, 7, 18, 0.95); backdrop-filter: blur(10px); z-index: 100; border-bottom: 1px solid var(--glass-border); }
    .header-logo { font-size: 1.5rem; font-weight: 800; font-style: italic; color: white; display: flex; align-items: center; gap: 10px;}
    .header-logo img { height: 35px; border-radius: 8px; box-shadow: 0 0 10px rgba(0, 204, 255, 0.3); }
    .header-icons i { font-size: 1.4rem; margin-left: 15px; color: white; cursor: pointer;}

    .chat-tabs-container { padding: 0 15px 15px 15px; overflow-x: auto; scrollbar-width: none; }
    .chat-tabs { display: flex; gap: 10px; }
    .chat-tab { padding: 10px 18px; border-radius: 25px; background: var(--glass-bg); border: 1px solid var(--glass-border); font-size: 0.85rem; color: var(--text-muted); cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 8px; transition: 0.3s; font-weight: bold; }
    .chat-tab i { font-size: 1rem; }
    .chat-tab.active { background: var(--primary); color: white; border-color: var(--neon); box-shadow: 0 0 15px rgba(0, 204, 255, 0.4); }

    .chat-list { padding: 0 15px 90px 15px; display: flex; flex-direction: column; gap: 10px; }
    .chat-item { display: flex; align-items: center; gap: 15px; padding: 15px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; cursor: pointer; transition: 0.3s; }
    .chat-item:hover { background: rgba(255,255,255,0.05); }
    
    .chat-avatar-container { position: relative; }
    .chat-avatar { width: 55px; height: 55px; border-radius: 50%; background: var(--primary); display: flex; justify-content: center; align-items: center; font-size: 1.5rem; object-fit: cover; border: 2px solid var(--glass-border); }
    .online-dot { position: absolute; bottom: 2px; right: 2px; width: 14px; height: 14px; background: var(--success); border-radius: 50%; border: 2px solid var(--bg-color); }
    
    .chat-info { flex: 1; }
    .chat-name-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .chat-name { font-weight: bold; font-size: 1rem; display: flex; align-items: center; gap: 5px; }
    .chat-time { font-size: 0.75rem; color: var(--text-muted); }
    .chat-last-msg { font-size: 0.85rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
    
    .chat-actions-right { display: flex; align-items: center; gap: 10px; }
    .action-icons { display: flex; gap: 8px; color: var(--neon); font-size: 1.1rem; }
    .action-icons i { cursor: pointer; background: rgba(0, 204, 255, 0.1); padding: 8px; border-radius: 50%; transition: 0.2s; }
    .action-icons i:hover { background: var(--primary); color: white; }
    
    .unread-badge { background: var(--primary); color: white; width: 22px; height: 22px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 0.75rem; font-weight: bold; box-shadow: 0 0 10px rgba(0, 204, 255, 0.5); }
    
    .empty-state { text-align: center; color: var(--text-muted); padding: 50px 20px; }
    .empty-state i { font-size: 3rem; margin-bottom: 15px; color: var(--glass-border); }

    /* POP-UP DE CHAMADA A RECEBER */
    .incoming-call-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 7, 18, 0.95); z-index: 5000; display: none; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(15px); }
    .incoming-avatar { width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--neon); animation: pulse 1.5s infinite; object-fit: cover;}
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(0, 204, 255, 0.4); } 70% { box-shadow: 0 0 0 20px rgba(0, 204, 255, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 204, 255, 0); } }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-logo"><img src="logo.png" alt="FLY"> Chat</div>
    <div class="header-icons">
      <i class="fa-solid fa-magnifying-glass"></i>
      <i class="fa-solid fa-plus" onclick="window.location.href='home.html'"></i>
    </div>
  </header>

  <div class="chat-tabs-container">
    <div class="chat-tabs">
      <div class="chat-tab active" id="tab-todos" onclick="switchTab('todos')"><i class="fa-solid fa-layer-group"></i> Todos</div>
      <div class="chat-tab" id="tab-clientes" onclick="switchTab('clientes')"><i class="fa-solid fa-users"></i> Clientes</div>
      <div class="chat-tab" id="tab-vendedores" onclick="switchTab('vendedores')"><i class="fa-solid fa-store"></i> Vendedores</div>
      <div class="chat-tab" id="tab-amigos" onclick="switchTab('amigos')"><i class="fa-solid fa-user-group"></i> Amigos</div>
      <div class="chat-tab" id="tab-seguidores" onclick="switchTab('seguidores')"><i class="fa-solid fa-user-plus"></i> Seguidores</div>
    </div>
  </div>

  <div class="chat-list" id="chatList">
    <div class="empty-state"><i class="fa-solid fa-comments"></i><p>A carregar as suas conversas...</p></div>
  </div>

  <!-- POP-UP A RECEBER CHAMADA -->
  <div class="incoming-call-overlay" id="incomingCallOverlay">
    <img id="incomingAvatar" src="default-avatar.png" class="incoming-avatar">
    <h2 id="incomingName" style="color:white; margin-top:20px;">A ligar...</h2>
    <p id="incomingType" style="color:var(--text-muted); margin-bottom:40px;">Chamada de vídeo...</p>
    <div style="display:flex; gap:30px;">
      <button onclick="declineCall()" style="width:70px; height:70px; border-radius:50%; background:var(--danger); color:white; border:none; font-size:1.8rem; cursor:pointer; box-shadow:0 0 20px rgba(255,51,102,0.5);"><i class="fa-solid fa-phone-slash"></i></button>
      <button onclick="acceptCall()" style="width:70px; height:70px; border-radius:50%; background:var(--success); color:white; border:none; font-size:1.8rem; cursor:pointer; box-shadow:0 0 20px rgba(0,230,118,0.5);"><i class="fa-solid fa-phone"></i></button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="home.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Início</span></a>
    <a href="mercado.html" class="nav-item"><i class="fa-solid fa-bag-shopping"></i><span>Mercado</span></a>
    <a href="chat.html" class="nav-item active"><i class="fa-solid fa-comment-dots"></i><span>Chat</span><span class="nav-badge" id="chat-badge" style="display:none;">0</span></a>
    <a href="gerenciar_vendas.html" class="nav-item"><i class="fa-solid fa-briefcase"></i><span>Negócio</span><span class="nav-badge" id="negocio-badge" style="display:none;">0</span></a>
    <a href="perfil.html" class="nav-item"><i class="fa-solid fa-user"></i><span>Perfil</span></a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script>
    let currentUser = null;
    let currentTab = 'todos';
    let myFollowingIds = []; let myFollowerIds = []; let myFriendIds = []; let myClientIds = []; let mySellerIds = [];
    let incomingCallData = null;
    let ringtone = null;

    async function updateBadges() {
      if (!currentUser) return;
      
      const { count: chatCount } = await supabaseClient.from('messages').select('*', { count: 'exact', head: true }).eq('receiver_id', currentUser).eq('is_read', false);
      const chatBadge = document.getElementById('chat-badge');
      if (chatBadge) { if (chatCount > 0) { chatBadge.innerText = chatCount; chatBadge.style.display = 'flex'; } else { chatBadge.style.display = 'none'; } }

      const { count: orderCount } = await supabaseClient.from('orders').select('*', { count: 'exact', head: true }).eq('seller_id', currentUser).eq('status', 'pendente');
      const negocioBadge = document.getElementById('negocio-badge');
      if (negocioBadge) { if (orderCount > 0) { negocioBadge.innerText = orderCount; negocioBadge.style.display = 'flex'; } else { negocioBadge.style.display = 'none'; } }
    }

    async function init() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }
      currentUser = session.user.id;
      
      updateBadges(); setInterval(updateBadges, 10000);

      const { data: follows } = await supabaseClient.from('follows').select('following_id').eq('follower_id', currentUser);
      if (follows) myFollowingIds = follows.map(f => f.following_id);
      const { data: followers } = await supabaseClient.from('follows').select('follower_id').eq('following_id', currentUser);
      if (followers) myFollowerIds = followers.map(f => f.follower_id);
      const { data: friends } = await supabaseClient.from('friendships').select('requester_id, addressee_id').eq('status', 'aceite').or(`requester_id.eq.${currentUser},addressee_id.eq.${currentUser}`);
      if (friends) { myFriendIds = friends.map(f => f.requester_id === currentUser ? f.addressee_id : f.requester_id); }

      const { data: orders } = await supabaseClient.from('orders').select('buyer_id, seller_id').or(`buyer_id.eq.${currentUser},seller_id.eq.${currentUser}`);
      if (orders) {
        orders.forEach(o => {
          if (o.seller_id === currentUser) myClientIds.push(o.buyer_id);
          if (o.buyer_id === currentUser) mySellerIds.push(o.seller_id);
        });
      }
      
      loadChats();
      listenForCalls();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.chat-tab').forEach(el => el.classList.remove('active'));
      document.getElementById(`tab-${tab}`).classList.add('active');
      loadChats();
    }

    async function loadChats() {
      const chatList = document.getElementById('chatList');
      chatList.innerHTML = '<p style="text-align: center; color: var(--text-muted);">A carregar...</p>';

      const { data: messages, error } = await supabaseClient.from('messages').select('*').or(`sender_id.eq.${currentUser},receiver_id.eq.${currentUser}`).order('created_at', { ascending: false });
      
      if (error) { chatList.innerHTML = '<p style="color:red; text-align:center;">Erro.</p>'; return; }
      if (!messages || messages.length === 0) { 
        chatList.innerHTML = `<div class="empty-state"><i class="fa-regular fa-comment-dots"></i><p>Ainda não tens conversas.</p></div>`; 
        return; 
      }

      const contacts = {};
      messages.forEach(msg => {
        const contactId = msg.sender_id === currentUser ? msg.receiver_id : msg.sender_id;
        if (!contacts[contactId]) contacts[contactId] = { lastMsg: msg, unread: 0 };
        if (msg.receiver_id === currentUser && msg.is_read === false) contacts[contactId].unread++;
      });

      let filteredContacts = Object.entries(contacts);

      if (currentTab === 'amigos') { filteredContacts = filteredContacts.filter(([id]) => myFriendIds.includes(id)); } 
      else if (currentTab === 'seguidores') { filteredContacts = filteredContacts.filter(([id]) => myFollowingIds.includes(id) || myFollowerIds.includes(id)); } 
      else if (currentTab === 'clientes') { filteredContacts = filteredContacts.filter(([id]) => myClientIds.includes(id)); } 
      else if (currentTab === 'vendedores') { filteredContacts = filteredContacts.filter(([id]) => mySellerIds.includes(id)); }

      if (filteredContacts.length === 0) {
        chatList.innerHTML = `<div class="empty-state"><i class="fa-regular fa-comments"></i><p>Nenhuma conversa nesta aba.</p></div>`;
        return;
      }

      chatList.innerHTML = '';

      for (const [contactId, data] of filteredContacts) {
        const { data: profile } = await supabaseClient.from('profiles').select('username, avatar_url, is_premium').eq('id', contactId).single();
        const name = profile ? profile.username : 'Utilizador FLY';
        const avatar = profile && profile.avatar_url ? profile.avatar_url : 'default-avatar.png';
        const time = new Date(data.lastMsg.created_at).toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' });
        const isPremium = profile && profile.is_premium;
        const verifiedIcon = isPremium ? '<i class="fa-solid fa-crown" style="color: #ffd700; font-size: 0.8rem;"></i>' : '<i class="fa-solid fa-circle-check" style="color: var(--neon); font-size: 0.8rem;"></i>';

        const item = document.createElement('div');
        item.className = 'chat-item';
        item.onclick = () => window.location.href = `conversa.html?seller_id=${contactId}`;
        item.innerHTML = `
          <div class="chat-avatar-container">
            <img src="${avatar}" class="chat-avatar">
            <div class="online-dot"></div>
          </div>
          <div class="chat-info">
            <div class="chat-name-row">
              <div class="chat-name">${name} ${verifiedIcon}</div>
              <div class="chat-time">${time}</div>
            </div>
            <div class="chat-last-msg">${data.lastMsg.content || 'Enviou um ficheiro'}</div>
          </div>
          <div class="chat-actions-right">
            <div class="action-icons">
              <i class="fa-solid fa-phone" onclick="event.stopPropagation(); startCall('${contactId}', 'audio')"></i>
              <i class="fa-solid fa-video" onclick="event.stopPropagation(); startCall('${contactId}', 'video')"></i>
            </div>
            ${data.unread > 0 ? `<div class="unread-badge">${data.unread}</div>` : ''}
          </div>
        `;
        chatList.appendChild(item);
      }
    }

    async function startCall(receiverId, type) {
      const { data: call, error } = await supabaseClient.from('calls').insert([{
        caller_id: currentUser, receiver_id: receiverId, type: type, status: 'ringing'
      }]).select().single();
      if (error) { alert('Erro ao ligar: ' + error.message); return; }
      window.location.href = `chamada.html?user_id=${receiverId}&type=${type}&call_id=${call.id}&role=caller`;
    }

    function listenForCalls() {
      supabaseClient.channel('incoming-calls')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'calls', filter: `receiver_id=eq.${currentUser}` }, async payload => {
          const call = payload.new;
          if (call.status === 'ringing') {
            ringtone = new Audio('https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3');
            ringtone.loop = true; 
            ringtone.play().catch(e => console.log("Erro ao tocar som:", e));
            if (navigator.vibrate) navigator.vibrate([500, 500, 500, 500, 500, 500, 500, 500]);

            const { data: profile } = await supabaseClient.from('profiles').select('username, avatar_url').eq('id', call.caller_id).single();
            
            document.getElementById('incomingAvatar').src = profile?.avatar_url || 'default-avatar.png';
            document.getElementById('incomingName').innerText = profile?.username || 'Alguém';
            document.getElementById('incomingType').innerText = call.type === 'video' ? 'Chamada de vídeo...' : 'Chamada de voz...';
            
            incomingCallData = call;
            document.getElementById('incomingCallOverlay').style.display = 'flex';
          }
        }).subscribe();
    }

    function acceptCall() {
      document.getElementById('incomingCallOverlay').style.display = 'none';
      if (ringtone) { ringtone.pause(); ringtone.currentTime = 0; }
      if (navigator.vibrate) navigator.vibrate(0);
      if (!incomingCallData) return;
      window.location.href = `chamada.html?user_id=${incomingCallData.caller_id}&type=${incomingCallData.type}&call_id=${incomingCallData.id}&role=receiver`;
    }

    async function declineCall() {
      document.getElementById('incomingCallOverlay').style.display = 'none';
      if (ringtone) { ringtone.pause(); ringtone.currentTime = 0; }
      if (navigator.vibrate) navigator.vibrate(0);
      if (incomingCallData) {
        await supabaseClient.from('calls').update({ status: 'declined' }).eq('id', incomingCallData.id);
        incomingCallData = null;
      }
    }

    init();
  </script>
</body>
</html>
